services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrarosa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-terrarosa}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrarosa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment during initial setup if you need to connect from your own
    # machine to run one-off admin queries. Keep commented out in production.
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    container_name: terra-rosa-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-terrarosa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-terrarosa}
      SESSION_SECRET: ${SESSION_SECRET}
      HOUSEKEEPING_PIN: ${HOUSEKEEPING_PIN:-1234}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      NODE_ENV: production
    ports:
      - "3060:3060"
    networks:
      - default
      - proxynet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3060/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  proxynet:
    external: true

volumes:
  db_data:
